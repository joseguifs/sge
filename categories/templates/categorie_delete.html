{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h3 class="display-4">Deletar categoria</h3>

    <div class="card">
      <div class="card-body">
        <p class="card-text">Tem certeza de que deseja excluir a categoria <strong>{{ object.name }}</strong>?</p>

        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Deletar categoria</button>
        </form>
        
        <a href="{% url 'categorie_list' %}" class="btn btn-secondary mt-3">Cancelar e voltar para a lista de categoria</a>
      </div>
    </div>
  </div>
{% endblock %}
