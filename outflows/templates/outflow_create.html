{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h3 class="dispaly-4">Registrar saída</h3>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Salvar saída</button>
            </form>
        </div>
    </div>
    <a href="{% url 'outflow_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
</div>


{% endblock %}
